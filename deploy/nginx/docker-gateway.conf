# Docker ichki DNS — scale/restart dan keyin stale IP bo'lmasin
resolver 127.0.0.11 valid=10s ipv6=off;

# Host nginx (SSL) dan kelgan proto saqlansin — aks holda Django 301 loop qiladi
map $http_x_forwarded_proto $imentor_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
        set $backend_upstream backend_fastapi:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $imentor_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location /media/ {
        set $backend_upstream backend_fastapi:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $imentor_forwarded_proto;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, max-age=3600" always;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $imentor_forwarded_proto;
    }
}
