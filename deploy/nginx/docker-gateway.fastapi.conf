# Faqat DEV cutover-repetitsiyasi uchun — /api/ ni Django o'rniga FastAPI'ga
# yo'naltiradi. Prod konfiguratsiyasiga (docker-gateway.conf) tegilmagan.
# JSON API javoblari uchun gzip — sillabus katalogi siqilmagan holda ~1.5 MB.
# (backend ham GZipMiddleware bilan siqadi; bu yerdagi sozlama zaxira va
# frontend statikasi uchun.)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $imentor_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
        set $backend_upstream backend_fastapi:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $imentor_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        # AI matnini jonli oqim (SSE) sifatida uzatish — nginx bufferlamasin.
        proxy_buffering off;
        proxy_cache off;
    }

    location /media/ {
        set $backend_upstream backend_fastapi:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $imentor_forwarded_proto;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, max-age=3600" always;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $imentor_forwarded_proto;
    }
}
